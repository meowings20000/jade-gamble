<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>賭石工坊 · Jade Gamble</title>
<style>
:root{
  --bg:#141210; --panel:#1e1a16; --panel2:#262019; --line:#3a322a;
  --text:#e8e2d8; --muted:#9a8f80; --gold:#d4a94e; --green:#5fb877;
  --red:#d46a5a; --glow:#f3d47c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
header h1{font-size:18px;color:var(--gold);letter-spacing:2px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:none;color:var(--muted);padding:8px 12px;font-size:14px;cursor:pointer;border-radius:8px}
nav button.active{color:var(--gold);background:var(--panel2)}
nav button:hover{color:var(--text)}
#balance{margin-left:auto;display:flex;align-items:center;gap:8px}
#balance .chips{color:var(--gold);font-weight:700;font-size:16px}
#userbox{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
main{max-width:1080px;margin:0 auto;padding:20px}
.view{display:none}
.view.active{display:block}
h2{font-size:20px;margin-bottom:14px;color:var(--text)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}
.shelf{margin-bottom:24px}
.shelf-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.shelf-head h3{font-size:15px;color:var(--gold)}
.shelf-head .price-note{font-size:12px;color:var(--muted)}
button.btn{background:var(--gold);color:#241c0e;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
button.btn:disabled{opacity:.4;cursor:default}
button.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.btn.danger{background:var(--red);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stone-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.stone-card canvas{width:100%;height:110px;border-radius:8px;background:#0d0b09}
.stone-card .price{color:var(--gold);font-weight:700}
.stone-card .hint{font-size:12px;color:var(--muted);line-height:1.5;min-height:36px}
.stone-card .meta{font-size:11px;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--panel);border:1px solid var(--line)}
.badge.win{color:var(--green);border-color:var(--green)}
.badge.lose{color:var(--red);border-color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.modal h3{color:var(--gold);margin-bottom:10px}
.modal canvas{width:100%;height:220px;border-radius:10px;background:#0d0b09}
.big-result{font-size:28px;font-weight:800;text-align:center;margin:10px 0}
.big-result.win{color:var(--green)}
.big-result.lose{color:var(--red)}
.ladder{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0}
.rung{padding:4px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.rung.past{opacity:.35}
.rung.cur{color:var(--gold);border-color:var(--gold);font-weight:700}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}
th{color:var(--muted);font-weight:400}
.rank1{color:var(--gold);font-weight:800}
.scratch-board{position:relative;width:100%;max-width:520px;aspect-ratio:4/3;margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.scratch-board canvas{position:absolute;inset:0;width:100%;height:100%}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:10px;z-index:200;font-size:14px;animation:fadeout 2.6s forwards}
@keyframes fadeout{0%,70%{opacity:1}100%{opacity:0}}
.egg-banner{background:linear-gradient(90deg,#2a2415,#3a3018,#2a2415);border:1px solid var(--glow);color:var(--glow);padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13px}
#login-view{max-width:400px;margin:60px auto;text-align:center}
#login-view .logo{font-size:40px;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.kv b{color:var(--gold)}
input{font-size:16px} /* iOS zoom guard */
html{-webkit-text-size-adjust:100%}
button{-webkit-tap-highlight-color:transparent}
@media(max-width:640px){
  header{flex-wrap:wrap;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
  header h1{font-size:16px;letter-spacing:1px}
  #userbox{display:none}
  #balance{order:2;margin-left:auto;gap:6px}
  #balance .chips{font-size:14px}
  #balance .btn{padding:8px 10px;font-size:12px;min-height:40px}
  nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-left:-12px;padding:0 12px 2px}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;min-height:40px}
  nav .btn{margin-left:6px}
  main{padding:12px}
  h2{font-size:18px}
  .modal-bg{padding:10px;align-items:flex-end}
  .modal{padding:14px;max-height:88vh;max-height:88dvh;border-radius:14px 14px 0 0}
  .modal canvas{height:170px}
  .big-result{font-size:22px}
  .stone-card .row{gap:6px}
  .stone-card .row .btn{flex:1;min-width:0;min-height:40px;padding:8px 8px}
  .stone-card canvas{height:96px}
  .stone-card .hint{min-height:0}
  #login-view{margin:24px auto}
  table td,table th{padding:6px 4px;font-size:12px}
  .kv{font-size:12px}
  .toast{width:max-content;max-width:92vw}
  .scratch-board{aspect-ratio:4/3}
}

body.mobile #classic-bet,body.mobile #yboss-bet{display:none !important}
body.mobile nav #classic-bet,body.mobile nav #yboss-bet{display:inline-flex !important}
</style>
</head>
<body>
<header>
  <h1>賭石工坊</h1>
  <nav id="nav" style="display:none">
    <button data-view="shop" class="active">商店</button>
    <button data-view="warehouse">倉庫</button>
    <button data-view="market">競標場</button>
    <button data-view="exchange">兌換所</button>
    <button data-view="collection">圖鑑</button>
    <button data-view="ranks">排行榜</button>
  </nav>
  <div id="balance">
    <div id="userbox"></div>
    <div class="chips" id="chips"></div>
    <button class="btn" id="classic-bet" style="display:none">传统模式</button>
    <button class="btn" id="yboss-bet" style="display:none">Y佬模式</button>
    <button class="btn ghost" id="lang-toggle" title="繁简切换">简</button>
    <button class="btn ghost" id="logout" style="display:none">登出</button>
  </div>
</header>
<main>
  <div class="view active" id="view-login">
    <div class="card" id="login-view">
      <div class="logo">🗿</div>
      <h2>一刀窮 · 一刀富</h2>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px">純虛擬籌碼，不含任何真實金錢。</p>
      <button class="btn" id="login-discord">用 Discord 登入</button>
      <button class="btn ghost" id="login-mock" style="display:none;margin-top:10px">訪客試玩</button>
    </div>
  </div>
  <div class="view" id="view-shop">
    <h2>每日礦區直送</h2>
    <p class="price-note" style="color:var(--muted);font-size:13px;margin-bottom:16px">每天 00:00 免費補貨；不滿意可以刷新，越刷越貴。</p>
    <div id="shop-grades"></div>
  </div>
  <div class="view" id="view-warehouse">
    <h2>我的倉庫</h2>
    <div id="warehouse-list" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))"></div>
  </div>
  <div class="view" id="view-market">
    <h2>競標場</h2>
    <div id="market-list" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))"></div>
  </div>
  <div class="view" id="view-exchange">
    <h2>兌換所</h2>
    <div id="exchange-list" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))"></div>
    <div class="card" style="margin-top:16px">
      <h3 style="color:var(--gold);margin-bottom:8px">破產救濟</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:10px">籌碼歸零時可以領救濟（每日 3 次）。</p>
      <div class="row">
        <button class="btn" id="relief-chips">領 1,000 籌碼</button>
        <button class="btn ghost" id="relief-ticket">刮到爽門票 + 300 籌碼</button>
      </div>
    </div>
  </div>
  <div class="view" id="view-collection">
    <h2>異色圖鑑 <span id="coll-score" style="color:var(--gold)"></span></h2>
    <div id="collection-list" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))"></div>
  </div>
  <div class="view" id="view-ranks">
    <h2>排行榜</h2>
    <div class="row" style="margin-bottom:14px">
      <button class="btn ghost" id="rank-wealth">財富榜</button>
      <button class="btn ghost" id="rank-coll">收藏家榜</button>
    </div>
    <div class="card"><table id="rank-table"></table></div>
    <h2 style="margin-top:24px">名人堂</h2>
    <div class="card"><table id="hall-table"></table></div>
  </div>
</main>
<script src="stone-render.js"></script>
<script src="app.js"></script>
</body>
</html>
